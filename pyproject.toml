[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "asic-ai"
version = "0.3.0"
description = "Domain-specialized AI model for ASIC analog and digital CMOS circuit design"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Ozgur Kazanci", email = "ozgurkazanci@gmail.com"},
]
keywords = ["asic", "eda", "vlsi", "cmos", "ai", "llm", "circuit-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "transformers>=5.0",
    "peft>=0.12",
    "trl>=0.15",
    "datasets>=3.0",
    "accelerate>=1.0",
    "wandb",
]
optimize = [
    "botorch>=0.10",
    "ax-platform>=0.3",
    "cma>=3.3",
]
sim = [
    "PySpice>=1.5",
]
eval = [
    "tabulate>=0.9",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/ozgurkazanci/AI_model"
Repository = "https://github.com/ozgurkazanci/AI_model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
