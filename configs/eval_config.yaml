# Eval Runner Configuration

# === TASK SOURCES ===
task_dirs:
  - eval/tasks/analog
  - eval/tasks/digital

# === SIMULATOR ===
simulator:
  backend: ngspice  # or nabla
  timeout: 60
  work_dir: ./eval_workdir

# === AGENT ===
agent:
  max_steps: 20
  max_retries_same_error: 3
  use_optimizer_for_analog: true
  checkpoint_interval: 5

# === OUTPUT ===
output:
  results_dir: ./eval_results
  format: json  # json | csv | markdown
  save_trajectories: true
  save_waveforms: false

# === PARALLEL EXECUTION ===
parallel:
  enabled: false
  max_workers: 4

# === BASELINE MODELS ===
# For comparison against existing models
baselines:
  - name: gpt-4o
    type: api
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model_id: gpt-4o
    
  - name: claude-opus
    type: api
    api_base: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-opus-4-20250514
    
  - name: qwen3.6-35b-base
    type: local
    model_path: Qwen/Qwen3.6-35B-A3B
    
  - name: asic-ai-sft
    type: local
    model_path: ./outputs/sft/checkpoint-final
    adapter_path: null
