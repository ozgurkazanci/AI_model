# Continued Pretraining (CPT) Configuration
# Framework: Axolotl
# Purpose: Inject circuit design domain knowledge into the base model
# Design Doc Reference: Section 4, Stage 1

# === BASE MODEL ===
base_model: Qwen/Qwen3.6-35B-A3B
model_type: AutoModelForCausalLM
trust_remote_code: true

# === TOKENIZER ===
# Extended tokenizer with SI prefixes, units, device names
# Run tokenizer extension BEFORE training:
#   python -m asic_ai.tokenizer.extend --model Qwen/Qwen3.6-35B-A3B --output ./tokenizer_extended
tokenizer_config:
  # Will be set to extended tokenizer path after extension
  # tokenizer: ./tokenizer_extended

# === ADAPTER (LoRA) ===
adapter: lora
lora_r: 32
lora_alpha: 64  # 2x rank
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_target_linear: false
# MoE-specific: apply LoRA to all experts equally
# (expert imbalance risk - monitor load balancing metrics)

# === DATASET ===
datasets:
  # Domain corpus (80-85%)
  - path: ./data/cpt/domain_corpus.jsonl
    type: completion
    field: text
    split: train
    weight: 0.85
  
  # General code mix (15-20%) - prevents catastrophic forgetting
  - path: ./data/cpt/general_code_mix.jsonl
    type: completion
    field: text
    split: train
    weight: 0.15

# === TRAINING HYPERPARAMETERS ===
# Key: LOW learning rate to prevent catastrophic forgetting
num_epochs: 1  # Single pass over corpus
micro_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-5  # LOW - critical for CPT
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

# === SEQUENCE LENGTH ===
sequence_len: 8192  # Base model's native context
sample_packing: true
pad_to_sequence_len: true

# === PRECISION ===
bf16: auto
tf32: true

# === HARDWARE ===
gradient_checkpointing: true
flash_attention: true
deepspeed: null  # Set for multi-GPU: deepspeed_configs/zero2.json

# === LOGGING ===
logging_steps: 10
eval_steps: 100
save_steps: 500
save_total_limit: 3
output_dir: ./outputs/cpt
wandb_project: asic-ai-cpt
wandb_entity: null  # Set to your W&B entity

# === EVALUATION ===
val_set_size: 0.02
eval_strategy: steps

# === NOTES ===
# 1. Corpus target: 1-5 billion tokens
# 2. This is the LEAST critical stage - can be skipped if base model 
#    already has sufficient domain knowledge (measure with eval set first)
# 3. Monitor for catastrophic forgetting: run general coding benchmarks 
#    (HumanEval, MBPP) alongside domain eval
# 4. Every source in the corpus must have license recorded in corpus manifest
