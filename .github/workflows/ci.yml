name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ eval/ tests/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true  # Strict typing is a goal, not a gate yet

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate eval task schemas
        run: |
          python -c "
          import yaml
          from pathlib import Path
          
          task_dirs = [Path('eval/tasks/analog'), Path('eval/tasks/digital')]
          required_fields = ['id', 'category', 'pdk', 'specs', 'pass_criteria']
          
          errors = []
          for task_dir in task_dirs:
              if not task_dir.exists():
                  continue
              for f in task_dir.glob('*.yaml'):
                  with open(f) as fh:
                      task = yaml.safe_load(fh)
                  for field in required_fields:
                      if field not in task:
                          errors.append(f'{f.name}: missing {field}')
          
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              exit(1)
          else:
              print(f'All eval tasks valid')
          "
