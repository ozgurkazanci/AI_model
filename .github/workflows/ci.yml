name: ASIC-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml ruff

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --select E,F --ignore E501
        continue-on-error: true

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest tests/ -v --tb=short

      - name: Validate SFT data format
        run: |
          PYTHONPATH=src python scripts/validate_sft_data.py \
            --input data/sft/train_final.jsonl \
            --report eval_results/ci_validation.json

      - name: Run pipeline demo
        run: |
          PYTHONPATH=src python scripts/demo_full_pipeline.py

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Validate eval task schemas
        run: |
          python -c "
          import yaml
          from pathlib import Path

          task_dirs = [Path('eval/tasks/analog'), Path('eval/tasks/digital')]
          required_fields = ['id', 'category', 'pdk', 'specs', 'pass_criteria']

          count = 0
          errors = []
          for task_dir in task_dirs:
              if not task_dir.exists():
                  continue
              for f in task_dir.glob('*.yaml'):
                  with open(f) as fh:
                      task = yaml.safe_load(fh)
                  count += 1
                  for field in required_fields:
                      if field not in task:
                          errors.append(f'{f.name}: missing {field}')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              exit(1)
          else:
              print(f'All {count} eval tasks valid')
          "

      - name: Check template rendering
        run: |
          PYTHONPATH=src python -c "
          from asic_ai.data.templates import list_templates, render_template
          templates = list_templates()
          for t in templates:
              rendered = render_template(t.id)
              assert '.subckt' in rendered or '.ends' in rendered
          print(f'All {len(templates)} templates render OK')
          "
