<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>mikroelektronix</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f6f4; --line: #e4e2dd;
    --ink: #1b1b19; --muted: #6f6d68;
    --user: #eceae5; --tool: #f2f6fb; --tool-line: #cfe0f2;
    --ok: #1f7a4d; --bad: #b0342c; --accent: #b8532a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1a; --panel: #232320; --line: #35342f;
      --ink: #eceae5; --muted: #a3a099;
      --user: #2b2a26; --tool: #1e2630; --tool-line: #2f4256;
      --ok: #62c08c; --bad: #e8827a; --accent: #e08a5e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  header h1 span { color: var(--accent); }
  .status { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .status b { font-weight: 500; color: var(--ink); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block;
         background: var(--bad); margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  header button {
    font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  header button:hover { border-color: var(--muted); }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
          color: var(--muted); margin-bottom: 5px; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .body {
    background: var(--user); border-radius: 10px; padding: 10px 13px;
  }

  .tool {
    border: 1px solid var(--tool-line); background: var(--tool);
    border-radius: 10px; margin: 10px 0; overflow: hidden;
  }
  .tool .head {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--tool-line);
    font-family: var(--mono); font-size: 12.5px;
  }
  .tool .head .name { font-weight: 600; }
  .tool .head .tag {
    margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid currentColor;
  }
  .tag.ok { color: var(--ok); } .tag.bad { color: var(--bad); }
  .tool pre {
    margin: 0; padding: 9px 12px; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);
    max-height: 220px; overflow-y: auto;
  }
  .tool pre + pre { border-top: 1px dashed var(--tool-line); }

  .note { font-size: 12px; color: var(--muted); font-style: italic; }
  .note.err { color: var(--bad); font-style: normal; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }

  footer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 9px 12px; min-height: 44px;
    max-height: 180px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  footer button {
    font: inherit; padding: 0 16px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; background: var(--accent); color: #fff;
  }
  footer button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  footer button:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>mikro<span>elektronix</span></h1>
    <div class="status">
      <span><i id="d-model" class="dot"></i>model: <b id="s-model">-</b></span>
      <span><i id="d-sim" class="dot"></i>simülatör: <b id="s-sim">-</b></span>
      <span id="s-device"></span>
      <span id="s-prov"></span>
    </div>
    <button id="reconnect">Yeniden bağlan</button>
    <button id="clear">Temizle</button>
  </header>

  <div id="log"><div class="wrap" id="stream"></div></div>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="Devre tasarımı isteyin. Örnek: sky130'da iki katlı OTA, dc_gain > 60 dB, UGB > 30 MHz."></textarea>
      <button id="send">Gönder</button>
      <button id="stop" class="ghost" style="display:none">Durdur</button>
    </div>
    <div class="hint">Enter gönderir, Shift+Enter satır atlar. Araç çağrıları gerçek ngspice'ta çalışır.</div>
  </footer>

<script>
const stream = document.getElementById('stream');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
let busy = false;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { const l = document.getElementById('log'); l.scrollTop = l.scrollHeight; }

function addMessage(role, text, label) {
  const m = el('div', 'msg ' + role);
  m.appendChild(el('div', 'role', label || role));
  m.appendChild(el('div', 'body', text));
  stream.appendChild(m); scroll();
  return m;
}
function addNote(text, isError) {
  const n = el('div', 'note' + (isError ? ' err' : ''), text);
  stream.appendChild(n); scroll();
  return n;
}

let pending = null;      // the "thinking" note, removed when a reply arrives
let lastTool = null;     // the open tool card, so its result lands inside it

function setBusy(on) {
  busy = on;
  sendBtn.disabled = on;
  stopBtn.style.display = on ? '' : 'none';
}

window.onAgentEvent = function (kind, data) {
  if (kind === 'thinking') {
    if (!pending) pending = addNote('düşünüyor...');
    return;
  }
  if (pending) { pending.remove(); pending = null; }

  if (kind === 'assistant') {
    if (data.text) {
      const m = addMessage('assistant', data.text, 'asistan');
      if (data.tokens) {
        m.appendChild(el('div', 'meta',
          data.tokens.prompt + ' + ' + data.tokens.completion + ' token'));
      }
    }
    (data.parse_errors || []).forEach(e => addNote('ayrıştırılamayan araç çağrısı: ' + e, true));
    return;
  }

  if (kind === 'tool_call') {
    const card = el('div', 'tool');
    const head = el('div', 'head');
    head.appendChild(el('span', 'name', data.name));
    const tag = el('span', 'tag ' + (data.valid ? 'ok' : 'bad'),
                   data.valid ? 'sözleşmede' : 'reddedildi');
    head.appendChild(tag);
    card.appendChild(head);
    card.appendChild(el('pre', null, JSON.stringify(data.arguments, null, 2)));
    if (!data.valid) card.appendChild(el('pre', null, data.reason));
    stream.appendChild(card); scroll();
    lastTool = card;
    return;
  }

  if (kind === 'tool_result') {
    const target = lastTool || stream;
    target.appendChild(el('pre', null, data.observation));
    lastTool = null; scroll();
    return;
  }

  if (kind === 'error')     { addNote(data.message, true); setBusy(false); return; }
  if (kind === 'cancelled') { addNote('durduruldu'); setBusy(false); return; }
  if (kind === 'done')      { setBusy(false); return; }
};

async function connect() {
  const info = await window.pywebview.api.connect();
  document.getElementById('s-model').textContent = info.model || 'yok';
  document.getElementById('s-sim').textContent = info.simulator || 'yok';
  document.getElementById('d-model').className = 'dot' + (info.model ? ' on' : '');
  document.getElementById('d-sim').className = 'dot' + (info.simulator ? ' on' : '');
  document.getElementById('s-device').textContent = info.device || '';
  const prov = info.provenance;
  document.getElementById('s-prov').textContent = prov
    ? `egitim: ${prov.examples ?? '?'} ornek / ${prov.epochs ?? '?'} epoch (${prov.built ?? '?'})`
    : '';
  (info.errors || []).forEach(e => addNote(e, true));
}

function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  addMessage('user', text, 'siz');
  input.value = ''; input.style.height = 'auto';
  setBusy(true);
  window.pywebview.api.send(text);
}

sendBtn.onclick = send;
stopBtn.onclick = () => window.pywebview.api.cancel();
document.getElementById('reconnect').onclick = connect;
document.getElementById('clear').onclick = async () => {
  await window.pywebview.api.reset();
  stream.innerHTML = ''; setBusy(false);
};
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

window.addEventListener('pywebviewready', connect);
</script>
</body>
</html>
